<div class="relative min-h-[950px] overflow-hidden">
  <!-- CHARACTER -->

  <div
    class="absolute top-[70px] left-1/2 -translate-x-1/2 w-[420px] h-[370px] z-30"
  >
    <template x-for="(slide,index) in slides" :key="index">
      <img
        x-show="activeSlide === index"
        :src="slide.image"
        class="absolute inset-0 w-full h-full object-contain"
        x-transition:enter="transition ease-out duration-700"
        x-transition:enter-start="opacity-0"
        x-transition:enter-end="opacity-100"
        x-transition:leave="transition ease-in duration-700"
        x-transition:leave-start="opacity-100"
        x-transition:leave-end="opacity-0"
        style="
          mask-image: linear-gradient(
            to top,
            transparent 0%,
            rgba(0, 0, 0, 0.2) 8%,
            rgba(0, 0, 0, 0.7) 18%,
            black 35%
          );

          -webkit-mask-image: linear-gradient(
            to top,
            transparent 0%,
            rgba(0, 0, 0, 0.2) 8%,
            rgba(0, 0, 0, 0.7) 18%,
            black 35%
          );
        "
      />
    </template>
  </div>

  <!-- CONTENT -->

  <div class="absolute top-[360px] left-0 w-full px-8 text-center z-40">
    <div
      class="transition-opacity duration-500"
      :class="contentVisible ? 'opacity-100' : 'opacity-0'"
    >
      <h1
        x-html="slides[activeSlide].title"
        class="font-['Anton'] uppercase leading-[0.9] tracking-[-2px] text-[96px] bg-gradient-to-b from-white to-[#7C5CFF] bg-clip-text text-transparent"
      ></h1>

      <p
        x-text="slides[activeSlide].description"
        class="mt-2 max-w-[290px] mx-auto text-[18px] leading-[1.6] text-[#B7A9CC]"
      ></p>

      <!-- MOBILE TIMELINE -->

      <div class="mt-10 w-[300px] mx-auto">
        <!-- LINE -->

        <div class="relative h-[2px] bg-[#8E7BC5]/60">
          <!-- DOT 1 -->

          <button
            @click="activeSlide = 0"
            class="absolute left-0 top-1/2 -translate-y-1/2 w-4 h-4 rounded-full transition-all duration-500"
            :class="activeSlide === 0
            ? 'bg-white shadow-[0_0_35px_#7C5CFF]'
            : 'bg-[#9B87C9]'"
          ></button>

          <!-- DOT 2 -->

          <button
            @click="activeSlide = 1"
            class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-4 h-4 rounded-full transition-all duration-500"
            :class="activeSlide === 1
            ? 'bg-white shadow-[0_0_35px_#7C5CFF]'
            : 'bg-[#9B87C9]'"
          ></button>

          <!-- DOT 3 -->

          <button
            @click="activeSlide = 2"
            class="absolute right-0 top-1/2 -translate-y-1/2 w-4 h-4 rounded-full transition-all duration-500"
            :class="activeSlide === 2
            ? 'bg-white shadow-[0_0_35px_#7C5CFF]'
            : 'bg-[#9B87C9]'"
          ></button>
        </div>

        <!-- LABELS -->

        <div class="flex justify-between mt-4 text-center">
          <div>
            <div class="text-[16px]">01</div>
            <div class="text-[16px]">Blogs</div>
          </div>

          <div>
            <div class="text-[16px]">02</div>
            <div class="text-[16px]">Books</div>
          </div>

          <div>
            <div class="text-[16px]">03</div>
            <div class="text-[16px]">Consult</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
