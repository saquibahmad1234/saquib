<section class="relative overflow-hidden bg-black py-24 lg:py-40">
  <!-- CONTINUED GLOW FROM ABOVE -->

  <!-- MAIN GLOW -->

  <div
    class="absolute left-1/2 top-[52%] w-[1400px] h-[800px] -translate-x-1/2 -translate-y-1/2 rounded-full bg-[#6B4DFF]/10 blur-[250px]"
  ></div>

  <!-- SECONDARY GLOW -->

  <div
    class="absolute left-1/2 top-[70%] w-[900px] h-[500px] -translate-x-1/2 -translate-y-1/2 rounded-full bg-[#7C5CFF]/8 blur-[180px]"
  ></div>

  <!-- CONTENT -->

  <div class="relative z-20 max-w-[1200px] mx-auto px-8 text-center">
    <!-- LABEL -->

    <div
      data-aos="fade-up"
      class="inline-flex items-center rounded-full bg-[#7C5CFF]/15 border border-[#7C5CFF]/30 px-5 py-2 text-[14px] tracking-[2px] uppercase text-[#C8B8FF]"
    >
      Let's Connect
    </div>

    <!-- HEADING -->

    <h2
      data-aos="fade-up"
      data-aos-delay="100"
      class="mt-8 text-[48px] md:text-[72px] leading-[1.05] text-white max-w-[1000px] mx-auto"
    >
      Let's Build Something Meaningful.
    </h2>

    <!-- TEXT -->

    <p
      data-aos="fade-up"
      data-aos-delay="200"
      class="mt-8 text-[22px] md:text-[28px] leading-[1.7] text-[#B7A9CC] max-w-[850px] mx-auto"
    >
      Whether it's taxation, personal finance, business decisions or simply a
      conversation, I'd love to hear from you.
    </p>

    <!-- CTA -->

    <div data-aos="fade-up" data-aos-delay="300" class="mt-14">
      <a
        href="{{ '/connect' | relative_url }}"
        class="group inline-flex items-center gap-3 rounded-full bg-[#7C5CFF] px-10 py-5 text-[20px] font-medium text-white shadow-[0_0_40px_rgba(124,92,255,0.45)] transition-all duration-300 hover:scale-105 hover:shadow-[0_0_60px_rgba(124,92,255,0.65)]"
      >
        Let's Connect

        <span
          class="transition-transform duration-300 group-hover:translate-x-1"
        >
          →
        </span>
      </a>
    </div>
  </div>

  <!-- FADE INTO FOOTER -->

  <div
    class="absolute bottom-0 left-0 w-full h-[140px] pointer-events-none"
    style="
      background: linear-gradient(
        to bottom,
        transparent 0%,
        rgba(0, 0, 0, 0.1) 25%,
        rgba(0, 0, 0, 0.35) 55%,
        rgba(0, 0, 0, 0.7) 80%,
        black 100%
      );
    "
  ></div>
</section>
