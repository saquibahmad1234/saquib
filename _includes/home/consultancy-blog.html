<section class="relative py-24 lg:py-32 overflow-hidden">
  <div class="max-w-[1600px] mx-auto px-8 lg:px-16">
    <!-- SECTION HEADER -->

    <div>
      <div
        class="inline-flex items-center rounded-full bg-[#7C5CFF]/15 border border-[#7C5CFF]/30 px-5 py-2 text-[14px] tracking-[2px] uppercase text-[#C8B8FF]"
      >
        All Blogs
      </div>

      <h2 class="mt-6 text-[42px] md:text-[60px] leading-[1.05] text-white">
        Explore the archive.
      </h2>
    </div>

    <!-- SEARCH -->

    <div class="mt-12">
      <div class="relative">
        <input
          id="blogSearch"
          type="text"
          placeholder="Search thoughts, stories and observations..."
          class="w-full rounded-[30px] bg-white/[0.04] backdrop-blur-xl border border-[#7C5CFF]/20 px-8 py-6 pr-16 text-[20px] text-white placeholder:text-[#8E7BC5] outline-none transition-all duration-300 focus:border-[#7C5CFF]/60 focus:shadow-[0_0_60px_rgba(124,92,255,0.15)]"
        />

        <svg
          class="absolute right-8 top-1/2 -translate-y-1/2 w-6 h-6 text-[#8E7BC5]"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          viewBox="0 0 24 24"
        >
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </div>
    </div>

    <!-- POSTS -->

    {% assign blog_posts = site.posts | where: "type", "blog" | sort: "date" |
    reverse %}

    <div id="blogGrid" class="grid md:grid-cols-2 lg:grid-cols-3 gap-8 mt-14">
      {% for post in blog_posts %}

      <a
        href="{{ post.url | relative_url }}"
        class="blog-card group relative overflow-hidden rounded-[30px]"
        data-title="{{ post.title | downcase }}"
        data-excerpt="{{ post.excerpt | downcase }}"
        data-aos="fade-up"
        data-aos-delay="{{ forloop.index0 | modulo:3 | times:100 }}"
      >
        <!-- IMAGE -->

        <div class="relative h-[380px] overflow-hidden">
          <img
            src="{{ post.featured_image }}"
            alt="{{ post.title }}"
            class="w-full h-full object-cover transition duration-700 group-hover:scale-110"
          />

          <div
            class="absolute inset-0 bg-gradient-to-t from-black via-black/40 to-transparent"
          ></div>

          <div class="absolute bottom-0 left-0 p-6">
            <div class="text-[#C8B8FF] text-[14px]">
              {{ post.date | date: "%d %b %Y" }}
            </div>

            <h3 class="mt-2 text-[28px] leading-tight text-white max-w-[260px]">
              {{ post.title }}
            </h3>
          </div>
        </div>
      </a>

      {% endfor %}
    </div>

    <!-- EMPTY STATE -->

    <div
      id="searchEmpty"
      class="hidden text-center mt-16 text-[#B7A9CC] text-[20px]"
    >
      No blog posts matched your search.
    </div>
  </div>
</section>
