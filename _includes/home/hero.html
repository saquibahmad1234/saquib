<section
  x-data="heroSlider()"
  class="relative min-h-screen overflow-hidden bg-black"
>
  <!-- BACKGROUND -->

  <div class="absolute inset-0 bg-black"></div>

  <!-- SPOTLIGHT -->

  <div
    class="absolute top-[42%] w-[700px] h-[550px] -translate-x-1/2 -translate-y-1/2 rounded-full bg-[#6B4DFF]/35 blur-[130px] transition-all duration-[2000ms] ease-out"
    :style="`left:${slides[activeSlide].glowX}`"
  ></div>

  <!-- VIGNETTE -->

  <div
    class="absolute inset-0 bg-[radial-gradient(circle_at_center,transparent_35%,rgba(0,0,0,0.75)_100%)]"
  ></div>

  <!-- FLOOR FADE -->

  <div
    class="absolute bottom-0 left-0 w-full h-[340px] bg-gradient-to-t from-black via-black to-transparent z-20"
  ></div>

  <!-- DESKTOP -->

  <div class="hidden lg:block">{% include home/hero-desktop.html %}</div>

  <!-- MOBILE -->

  <div class="lg:hidden">{% include home/hero-mobile.html %}</div>
</section>
